name: Merriv model release gate
description: Install Merriv, compare recorded model outputs, verify the Model Change Report, and upload evidence.

inputs:
  baseline:
    description: Path to baseline recorded-output JSONL.
    required: true
  candidate:
    description: Path to candidate recorded-output JSONL.
    required: true
  suite:
    description: Path to the paired evaluation suite JSONL.
    required: true
  policy:
    description: Path to the release policy YAML.
    required: true
  output:
    description: Destination directory for the report bundle.
    required: false
    default: runs/merriv-release
  slice-key:
    description: Optional single slice key to evaluate.
    required: false
    default: ""
  resamples:
    description: Paired bootstrap resample count.
    required: false
    default: "2000"
  python-version:
    description: Python version used to run Merriv.
    required: false
    default: "3.12"
  artifact-name:
    description: Uploaded evidence artifact name.
    required: false
    default: model-change-report

outputs:
  exit-code:
    description: Merriv evaluation code (0 pass, 2 block, 3 error, 4 disallowed warn).
    value: ${{ steps.final.outputs.exit-code }}
  report:
    description: Path to the generated machine-readable Model Change Report.
    value: ${{ inputs.output }}/mcr-report.json

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Merriv
      shell: bash
      env:
        MERRIV_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --require-hashes \
          -r "$MERRIV_ACTION_PATH/action-requirements.lock"
        python -m pip install --no-deps --no-build-isolation "$MERRIV_ACTION_PATH"
    - name: Compare and gate candidate
      id: compare
      shell: bash
      env:
        MERRIV_BASELINE: ${{ inputs.baseline }}
        MERRIV_CANDIDATE: ${{ inputs.candidate }}
        MERRIV_SUITE: ${{ inputs.suite }}
        MERRIV_POLICY: ${{ inputs.policy }}
        MERRIV_OUTPUT: ${{ inputs.output }}
        MERRIV_SLICE_KEY: ${{ inputs.slice-key }}
        MERRIV_RESAMPLES: ${{ inputs.resamples }}
      run: |
        arguments=(
          "$MERRIV_BASELINE" "$MERRIV_CANDIDATE"
          --suite "$MERRIV_SUITE"
          --policy "$MERRIV_POLICY"
          --output "$MERRIV_OUTPUT"
          --resamples "$MERRIV_RESAMPLES"
        )
        if [[ -n "$MERRIV_SLICE_KEY" ]]; then
          arguments+=(--slice-key "$MERRIV_SLICE_KEY")
        fi
        set +e
        merriv compare "${arguments[@]}"
        result=$?
        set -e
        echo "exit-code=$result" >> "$GITHUB_OUTPUT"
    - name: Verify portable report identities
      id: verify
      if: steps.compare.outputs.exit-code != '3'
      shell: bash
      env:
        MERRIV_OUTPUT: ${{ inputs.output }}
      run: |
        set +e
        merriv mcr verify "$MERRIV_OUTPUT" --strict
        result=$?
        set -e
        echo "exit-code=$result" >> "$GITHUB_OUTPUT"
    - name: Resolve final action result
      id: final
      if: always()
      shell: bash
      env:
        MERRIV_COMPARE_EXIT_CODE: ${{ steps.compare.outputs.exit-code }}
        MERRIV_VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit-code }}
      run: |
        final_code="${MERRIV_COMPARE_EXIT_CODE:-3}"
        if [[ "$final_code" != "3" && "${MERRIV_VERIFY_EXIT_CODE:-3}" != "0" ]]; then
          final_code=3
        fi
        echo "exit-code=$final_code" >> "$GITHUB_OUTPUT"
    - name: Upload release evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output }}/mcr-report.json
          ${{ inputs.output }}/evidence-manifest.json
          ${{ inputs.output }}/release-plan.json
          ${{ inputs.output }}/summary.md
          ${{ inputs.output }}/junit.xml
          ${{ inputs.output }}/results.sarif
        if-no-files-found: warn
        retention-days: 30
    - name: Enforce release decision
      if: always()
      shell: bash
      env:
        MERRIV_EXIT_CODE: ${{ steps.final.outputs.exit-code }}
      run: exit "${MERRIV_EXIT_CODE:-3}"
