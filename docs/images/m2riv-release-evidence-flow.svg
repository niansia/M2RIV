<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img" aria-labelledby="title description">
  <title id="title">M2RIV release evidence architecture</title>
  <desc id="description">Producers feed the M2RIV evidence kernel, which emits a Model Change Report for release consumers and four-state decisions. A lower lane shows the NVIDIA ModelOpt and TensorRT example.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f2f6fc"/>
    </linearGradient>
    <linearGradient id="mcr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f65c7"/>
      <stop offset="1" stop-color="#234eaa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e335c" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#17356f"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #142342; }
      .title { font-size: 64px; font-weight: 760; letter-spacing: 1px; }
      .subtitle { font-size: 27px; font-weight: 450; fill: #344969; }
      .panel { fill: #fff; stroke: #a9b9d2; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .panel-head { fill: #f3f7fd; stroke: #a9b9d2; stroke-width: 1.5; }
      .number { fill: #2f65c7; }
      .number-text { fill: #fff; font-size: 21px; font-weight: 750; text-anchor: middle; dominant-baseline: middle; }
      .head-text { font-size: 22px; font-weight: 700; }
      .chip { fill: #fbfdff; stroke: #86a8df; stroke-width: 1.4; rx: 9; }
      .chip-text { font-size: 18px; font-weight: 520; dominant-baseline: middle; }
      .card { fill: #f8fbff; stroke: #86a8df; stroke-width: 1.4; rx: 10; }
      .card-title { font-size: 18px; font-weight: 650; text-anchor: middle; }
      .icon { fill: none; stroke: #1d4389; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #17356f; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .bullet { fill: #2f65c7; }
      .bullet-text { font-size: 17px; }
      .bullet-small { font-size: 15px; }
      .mcr-title { fill: #fff; }
      .pass-text { fill: #4f8739; }
      .warn-text { fill: #c77b19; }
      .block-text { fill: #b63e3e; }
      .error-text { fill: #bd4838; }
      .small { font-size: 15px; fill: #50627e; }
      .lane-title { font-size: 21px; font-weight: 700; }
      .lane-node { fill: #fff; stroke: #9aa9bf; stroke-width: 1.4; rx: 10; }
      .lane-node-key { fill: #eef4ff; stroke: #5d87d5; stroke-width: 1.6; rx: 10; }
      .lane-text { font-size: 16px; font-weight: 620; text-anchor: middle; dominant-baseline: middle; }
      .lane-arrow { stroke: #17356f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .status-text { font-size: 19px; font-weight: 740; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1680" height="900" fill="url(#page)"/>
  <text x="840" y="76" class="title" text-anchor="middle">M2RIV</text>
  <text x="840" y="118" class="subtitle" text-anchor="middle">Vendor-neutral release evidence for deployable AI models</text>

  <!-- 1. Producers -->
  <g>
    <rect x="34" y="160" width="286" height="486" class="panel"/>
    <path d="M50 160 H304 Q320 160 320 176 V220 H34 V176 Q34 160 50 160 Z" class="panel-head"/>
    <circle cx="70" cy="190" r="20" class="number"/>
    <text x="70" y="191" class="number-text">1</text>
    <text x="101" y="197" class="head-text">Producers / Inputs</text>

    <g transform="translate(52 240)"><rect width="250" height="48" class="chip"/><circle cx="25" cy="24" r="10" class="icon"/><path d="M25 8 V15 M13 16 L18 20 M37 16 L32 20" class="icon"/><text x="48" y="25" class="chip-text">PyTorch / HF model</text></g>
    <g transform="translate(52 300)"><rect width="250" height="48" class="chip"/><circle cx="25" cy="24" r="12" class="icon"/><path d="M13 24 H37 M25 12 C19 18 19 30 25 36 M25 12 C31 18 31 30 25 36" class="icon"/><text x="48" y="25" class="chip-text">API endpoint</text></g>
    <g transform="translate(52 360)"><rect width="250" height="48" class="chip"/><path d="M13 32 L25 12 L37 32 Z M13 32 L25 25 L37 32 M25 12 V25" class="icon"/><text x="48" y="25" class="chip-text">ONNX artifact</text></g>
    <g transform="translate(52 420)"><rect width="250" height="48" class="chip"/><path d="M12 31 A14 14 0 0 1 38 31 M25 31 L33 19" class="icon"/><text x="48" y="25" class="chip-text">TensorRT engine</text></g>
    <g transform="translate(52 480)"><rect width="250" height="48" class="chip"/><path d="M14 34 V25 M22 34 V16 M30 34 V21 M38 34 V11" class="icon"/><text x="48" y="25" class="chip-text">Polygraphy evidence</text></g>
    <g transform="translate(52 540)"><rect width="250" height="48" class="chip"/><ellipse cx="25" cy="16" rx="13" ry="7" class="icon"/><path d="M12 16 V31 C12 39 38 39 38 31 V16 M12 24 C12 32 38 32 38 24" class="icon"/><text x="48" y="25" class="chip-text">MLflow registry</text></g>
  </g>

  <path d="M330 403 H356" class="arrow"/>

  <!-- 2. Evidence kernel -->
  <g>
    <rect x="372" y="160" width="338" height="486" class="panel"/>
    <path d="M388 160 H694 Q710 160 710 176 V220 H372 V176 Q372 160 388 160 Z" class="panel-head"/>
    <circle cx="408" cy="190" r="20" class="number"/>
    <text x="408" y="191" class="number-text">2</text>
    <text x="439" y="197" class="head-text">M2RIV Evidence Kernel</text>

    <g transform="translate(392 240)"><rect width="142" height="108" class="card"/><path d="M42 34 H100 M53 34 L45 57 H61 Z M89 34 L81 57 H97 Z M71 22 V70" class="icon"/><text x="71" y="92" class="card-title">Artifact diff</text></g>
    <g transform="translate(548 240)"><rect width="142" height="108" class="card"/><path d="M27 51 H43 L50 28 L60 70 L70 39 L79 55 H111" class="icon"/><text x="71" y="92" class="card-title">Numerical diff</text></g>
    <g transform="translate(392 362)"><rect width="142" height="108" class="card"/><path d="M71 21 L92 30 V48 C92 62 82 72 71 78 C60 72 50 62 50 48 V30 Z M62 48 L68 54 L81 40" class="icon"/><text x="71" y="90" class="card-title">Contract checks</text></g>
    <g transform="translate(548 362)"><rect width="142" height="108" class="card"/><path d="M39 70 V54 M55 70 V40 M71 70 V48 M87 70 V30 M103 70 V22" class="icon"/><text x="71" y="90" class="card-title">Paired statistics</text></g>
    <g transform="translate(392 484)"><rect width="142" height="108" class="card"/><circle cx="71" cy="48" r="20" class="icon"/><path d="M71 20 V27 M71 69 V76 M43 48 H50 M92 48 H99 M52 29 L57 34 M85 62 L90 67" class="icon"/><text x="71" y="91" class="card-title">Policy engine</text></g>
    <g transform="translate(548 484)"><rect width="142" height="108" class="card"/><circle cx="49" cy="35" r="6" class="icon"/><circle cx="94" cy="35" r="6" class="icon"/><circle cx="71" cy="69" r="6" class="icon"/><path d="M55 38 L66 64 M88 38 L76 64" class="icon"/><text x="71" y="91" class="card-title">Bisect</text></g>
    <text x="541" y="624" class="small" text-anchor="middle">compare → quantify → gate → locate</text>
  </g>

  <path d="M720 403 H744" class="arrow"/>

  <!-- 3. MCR -->
  <g>
    <rect x="760" y="160" width="258" height="486" class="panel"/>
    <path d="M776 160 H1002 Q1018 160 1018 176 V220 H760 V176 Q760 160 776 160 Z" class="panel-head"/>
    <circle cx="796" cy="190" r="20" class="number"/>
    <text x="796" y="191" class="number-text">3</text>
    <text x="827" y="197" class="head-text">MCR Protocol</text>
    <rect x="780" y="244" width="218" height="332" rx="12" fill="#fff" stroke="#2f65c7" stroke-width="2"/>
    <path d="M792 244 H986 Q998 244 998 256 V315 H780 V256 Q780 244 792 244 Z" fill="url(#mcr)"/>
    <text x="889" y="273" class="mcr-title" font-size="20" font-weight="700" text-anchor="middle">Model Change Report</text>
    <text x="889" y="299" class="mcr-title" font-size="18" text-anchor="middle">MCR 0.4</text>
    <g><circle cx="805" cy="348" r="4" class="bullet"/><text x="820" y="354" class="bullet-text">content identity</text></g>
    <g><circle cx="805" cy="390" r="4" class="bullet"/><text x="820" y="396" class="bullet-text">evidence sets</text></g>
    <g><circle cx="805" cy="432" r="4" class="bullet"/><text x="820" y="438" class="bullet-text">decision semantics</text></g>
    <g><circle cx="805" cy="474" r="4" class="bullet"/><text x="820" y="480" class="bullet-text">portable bundle</text></g>
    <g><circle cx="805" cy="516" r="4" class="bullet"/><text x="817" y="522" class="bullet-text bullet-small">independent verification</text></g>
  </g>

  <path d="M1028 403 H1052" class="arrow"/>

  <!-- 4. Consumers -->
  <g>
    <rect x="1068" y="160" width="300" height="486" class="panel"/>
    <path d="M1084 160 H1352 Q1368 160 1368 176 V220 H1068 V176 Q1068 160 1084 160 Z" class="panel-head"/>
    <circle cx="1104" cy="190" r="20" class="number"/>
    <text x="1104" y="191" class="number-text">4</text>
    <text x="1135" y="197" class="head-text">Consumers / Integrations</text>
    <g transform="translate(1088 250)"><rect width="260" height="52" class="chip"/><text x="22" y="27" font-size="22">⌁</text><text x="54" y="27" class="chip-text">CI / GitHub Actions</text></g>
    <g transform="translate(1088 316)"><rect width="260" height="52" class="chip"/><circle cx="28" cy="26" r="11" class="icon"/><path d="M28 9 V15 M28 37 V43 M11 26 H17 M39 26 H45" class="icon"/><text x="54" y="27" class="chip-text">Release controller</text></g>
    <g transform="translate(1088 382)"><rect width="260" height="52" class="chip"/><text x="20" y="29" font-size="18" font-weight="700" fill="#2f65c7">mlflow</text><text x="88" y="27" class="chip-text">consumer</text></g>
    <g transform="translate(1088 448)"><rect width="260" height="52" class="chip"/><path d="M28 12 L42 18 V29 C42 38 35 44 28 48 C21 44 14 38 14 29 V18 Z" class="icon"/><text x="54" y="27" class="chip-text">Audit / governance</text></g>
    <g transform="translate(1088 514)"><rect width="260" height="52" class="chip"/><circle cx="20" cy="20" r="6" class="icon"/><circle cx="38" cy="20" r="6" class="icon"/><path d="M9 40 C10 30 30 30 31 40 M27 40 C28 30 48 30 49 40" class="icon"/><text x="62" y="27" class="chip-text">Third-party verifiers</text></g>
  </g>

  <path d="M1378 403 H1402" class="arrow"/>

  <!-- 5. Decisions -->
  <g>
    <rect x="1418" y="160" width="228" height="486" class="panel"/>
    <path d="M1434 160 H1630 Q1646 160 1646 176 V220 H1418 V176 Q1418 160 1434 160 Z" class="panel-head"/>
    <circle cx="1454" cy="190" r="20" class="number"/>
    <text x="1454" y="191" class="number-text">5</text>
    <text x="1485" y="197" class="head-text">Release Decision</text>
    <g transform="translate(1438 254)"><rect width="188" height="58" rx="10" fill="#f3faef" stroke="#75a962"/><circle cx="28" cy="29" r="13" fill="none" stroke="#57933f" stroke-width="3"/><path d="M21 29 L26 34 L36 23" fill="none" stroke="#57933f" stroke-width="3"/><text x="117" y="30" class="status-text pass-text">PASS</text></g>
    <g transform="translate(1438 326)"><rect width="188" height="58" rx="10" fill="#fff8ed" stroke="#e8a84c"/><path d="M28 14 L43 42 H13 Z" fill="#e8a84c"/><text x="28" y="36" class="mcr-title" font-size="18" font-weight="800" text-anchor="middle">!</text><text x="117" y="30" class="status-text warn-text">WARN</text></g>
    <g transform="translate(1438 398)"><rect width="188" height="58" rx="10" fill="#fff1f1" stroke="#d95d5d"/><circle cx="28" cy="29" r="14" fill="#d95d5d"/><rect x="23" y="20" width="3" height="18" fill="#fff"/><rect x="29" y="18" width="3" height="20" fill="#fff"/><rect x="35" y="22" width="3" height="16" fill="#fff"/><text x="117" y="30" class="status-text block-text">BLOCK</text></g>
    <g transform="translate(1438 470)"><rect width="188" height="58" rx="10" fill="#fff4f2" stroke="#df7565"/><circle cx="28" cy="29" r="14" fill="none" stroke="#d55a49" stroke-width="3"/><path d="M21 22 L35 36 M35 22 L21 36" stroke="#d55a49" stroke-width="3"/><text x="117" y="30" class="status-text error-text">ERROR</text></g>
    <line x1="1442" y1="565" x2="1622" y2="565" stroke="#b7c2d2"/>
    <text x="1532" y="600" font-size="17" text-anchor="middle" fill="#435674">ship · review · stop · fix</text>
  </g>

  <!-- NVIDIA vertical -->
  <g>
    <rect x="34" y="682" width="1612" height="178" rx="16" fill="#fff" stroke="#a9b9d2" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="58" y="718" class="lane-title">NVIDIA vertical example</text>
    <g transform="translate(58 742)"><rect width="160" height="76" class="lane-node"/><text x="80" y="38" class="lane-text">FP16 model</text></g>
    <path d="M226 780 H252" class="lane-arrow"/>
    <g transform="translate(264 742)"><rect width="194" height="76" class="lane-node"/><text x="97" y="29" class="lane-text">ModelOpt</text><text x="97" y="52" class="small" text-anchor="middle">quantization</text></g>
    <path d="M466 780 H492" class="lane-arrow"/>
    <g transform="translate(504 742)"><rect width="122" height="76" class="lane-node"/><text x="61" y="38" class="lane-text">ONNX</text></g>
    <path d="M634 780 H660" class="lane-arrow"/>
    <g transform="translate(672 742)"><rect width="142" height="76" class="lane-node"/><text x="71" y="38" class="lane-text">TensorRT</text></g>
    <path d="M822 780 H848" class="lane-arrow"/>
    <g transform="translate(860 742)"><rect width="152" height="76" class="lane-node"/><text x="76" y="38" class="lane-text">Polygraphy</text></g>
    <path d="M1020 780 H1046" class="lane-arrow"/>
    <g transform="translate(1058 742)"><rect width="124" height="76" class="lane-node-key"/><text x="62" y="38" class="lane-text" fill="#244f9d">M2RIV</text></g>
    <path d="M1190 780 H1216" class="lane-arrow"/>
    <g transform="translate(1228 742)"><rect width="108" height="76" class="lane-node-key"/><text x="54" y="38" class="lane-text" fill="#244f9d">MCR</text></g>
    <path d="M1344 780 H1370" class="lane-arrow"/>
    <g transform="translate(1382 742)"><rect width="112" height="76" class="lane-node"/><text x="56" y="38" class="lane-text">Gate</text></g>
    <path d="M1502 780 H1528" class="lane-arrow"/>
    <g transform="translate(1540 742)"><rect width="82" height="76" rx="10" fill="#fff1f1" stroke="#d95d5d"/><text x="41" y="38" class="lane-text block-text">BLOCK</text></g>
  </g>
</svg>
