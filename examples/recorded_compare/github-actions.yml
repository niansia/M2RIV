name: Model release gate

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  m2riv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Compare candidate with champion
        run: |
          m2riv compare \
            examples/recorded_compare/baseline.jsonl \
            examples/recorded_compare/candidate.jsonl \
            --suite examples/recorded_compare/suite.jsonl \
            --policy examples/recorded_compare/policy.yaml \
            --slice-key frequency \
            --output runs/release
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-change-report
          path: runs/release
      - if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: runs/release/results.sarif
