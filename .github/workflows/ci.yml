name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,onnx]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=m2riv --cov-report=term-missing --cov-fail-under=90
      - run: python -m pip check
      - if: matrix.python-version == '3.13'
        run: |
          m2riv schema export schemas/v1
          git diff --exit-code -- schemas/v1
      - if: matrix.python-version == '3.13'
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

  onnx-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[onnx-demo]"
      - run: python examples/onnx_quantization/run_demo.py --output runs/onnx-quantization
      - run: python tools/verify_onnx_demo.py runs/onnx-quantization
      - run: python examples/onnx_opset_upgrade/run_demo.py --output runs/onnx-opset-upgrade
