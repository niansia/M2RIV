name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade the runner packaging bootstrap above known vulnerable versions
        run: python -m pip install "pip>=26.2" "setuptools>=83"
      - run: python -m pip install -e ".[dev,onnx]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=m2riv --cov-report=term-missing --cov-fail-under=91
      - run: python -m pip_audit --local --skip-editable
      - run: python -m pip check
      - if: matrix.python-version == '3.13'
        shell: bash
        run: |
          m2riv schema export schemas/mcr-0.4
          git diff --exit-code -- schemas/mcr-0.4
          test -z "$(git status --porcelain --untracked-files=all -- schemas/mcr-0.4)"
          python tools/verify_regression_corpus.py
          m2riv conformance producer examples/mcr_conformance
      - if: matrix.python-version == '3.13'
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run the repository's composite action
        id: gate
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/recorded_compare/baseline.jsonl
          candidate: examples/recorded_compare/candidate.jsonl
          suite: examples/recorded_compare/suite.jsonl
          policy: examples/recorded_compare/policy.yaml
          output: runs/action-smoke
          slice-key: frequency
          resamples: "200"
          artifact-name: action-smoke-${{ github.run_id }}
      - name: Assert BLOCK semantics and portable bundle
        if: always()
        env:
          M2RIV_ACTION_OUTCOME: ${{ steps.gate.outcome }}
          M2RIV_ACTION_EXIT_CODE: ${{ steps.gate.outputs.exit-code }}
        run: |
          test "$M2RIV_ACTION_OUTCOME" = "failure"
          test "$M2RIV_ACTION_EXIT_CODE" = "2"
          test -f runs/action-smoke/mcr-report.json
          test -f runs/action-smoke/evidence-manifest.json
          test -f runs/action-smoke/release-plan.json
          test -f runs/action-smoke/summary.md
          test -f runs/action-smoke/junit.xml
          test -f runs/action-smoke/results.sarif
          m2riv mcr verify runs/action-smoke --strict
      - name: Verify cross-language content identity vectors
        run: node examples/content_identity/verify_golden.mjs

  rust-mcr-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the Python verifier and select the stable Rust toolchain
        run: |
          python -m pip install -e .
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Verify typed identity vectors in Python, Node, and Rust
        run: |
          python examples/content_identity/generate_vectors.py --check
          python examples/content_identity/verify_golden.py
          node examples/content_identity/verify_golden.mjs
          cargo fmt --manifest-path reference/mcr-reference-rust/Cargo.toml -- --check
          cargo test --locked --manifest-path reference/mcr-reference-rust/Cargo.toml
          cargo run --locked --quiet --manifest-path reference/mcr-reference-rust/Cargo.toml -- vectors examples/content_identity/golden-vectors.json
          cargo run --locked --quiet --manifest-path reference/mcr-reference-rust/Cargo.toml -- float-vectors examples/content_identity/float-vectors.json
      - name: Verify bidirectional Python and Rust MCR interoperability
        run: |
          python examples/independent_producer/generate_bundle.py --check
          python tools/verify_rust_interop.py

  reproducible-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install "pip>=26.2" "setuptools>=83" "build==1.6.0"
      - name: Build twice from the same source epoch
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          reproducibility_root="${RUNNER_TEMP}/m2riv-repro-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${reproducibility_root}/a" "${reproducibility_root}/b"
          python -m build --outdir "${reproducibility_root}/a"
          python -m build --outdir "${reproducibility_root}/b"
          cmp "${reproducibility_root}"/a/*.whl "${reproducibility_root}"/b/*.whl
          cmp "${reproducibility_root}"/a/*.tar.gz "${reproducibility_root}"/b/*.tar.gz
          sha256sum "${reproducibility_root}"/a/* "${reproducibility_root}"/b/*

  onnx-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[onnx-demo]"
      - run: python examples/onnx_quantization/run_demo.py --output runs/onnx-quantization
      - run: python tools/verify_onnx_demo.py runs/onnx-quantization
      - run: python examples/onnx_opset_upgrade/run_demo.py --output runs/onnx-opset-upgrade
      - name: Upload platform-specific ONNX evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onnx-release-evidence-${{ matrix.os }}
          path: |
            runs/onnx-quantization
            runs/onnx-opset-upgrade
          if-no-files-found: error
          retention-days: 14
