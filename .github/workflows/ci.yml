name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,onnx]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=m2riv --cov-report=term-missing --cov-fail-under=91
      - run: python -m pip_audit --local --skip-editable
      - run: python -m pip check
      - if: matrix.python-version == '3.13'
        run: |
          m2riv schema export schemas/v1
          git diff --exit-code -- schemas/v1
      - if: matrix.python-version == '3.13'
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run the repository's composite action
        id: gate
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/recorded_compare/baseline.jsonl
          candidate: examples/recorded_compare/candidate.jsonl
          suite: examples/recorded_compare/suite.jsonl
          policy: examples/recorded_compare/policy.yaml
          output: runs/action-smoke
          slice-key: frequency
          resamples: "200"
          artifact-name: action-smoke-${{ github.run_id }}
      - name: Assert BLOCK semantics and portable bundle
        if: always()
        env:
          M2RIV_ACTION_OUTCOME: ${{ steps.gate.outcome }}
          M2RIV_ACTION_EXIT_CODE: ${{ steps.gate.outputs.exit-code }}
        run: |
          test "$M2RIV_ACTION_OUTCOME" = "failure"
          test "$M2RIV_ACTION_EXIT_CODE" = "2"
          test -f runs/action-smoke/m2riv-report.json
          test -f runs/action-smoke/evidence-manifest.json
          test -f runs/action-smoke/release-plan.json
          test -f runs/action-smoke/summary.md
          test -f runs/action-smoke/junit.xml
          test -f runs/action-smoke/results.sarif
          m2riv mcr verify runs/action-smoke --strict
      - name: Verify cross-language content identity vectors
        run: node examples/content_identity/verify_golden.mjs

  onnx-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[onnx-demo]"
      - run: python examples/onnx_quantization/run_demo.py --output runs/onnx-quantization
      - run: python tools/verify_onnx_demo.py runs/onnx-quantization
      - run: python examples/onnx_opset_upgrade/run_demo.py --output runs/onnx-opset-upgrade
      - name: Upload platform-specific ONNX evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onnx-release-evidence-${{ matrix.os }}
          path: |
            runs/onnx-quantization
            runs/onnx-opset-upgrade
          if-no-files-found: error
          retention-days: 14
