name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          version: "0.11.18"
          enable-cache: false
      - name: Install the locked build frontend
        run: uv sync --frozen --extra dev --group action-build
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi
      - name: Build wheel and source distribution
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv run --frozen python -m build --no-isolation
      - name: Verify wheel installation
        run: |
          uv venv release-smoke --python 3.13
          uv pip install --python release-smoke/bin/python --require-hashes -r action-requirements.lock
          uv pip install --python release-smoke/bin/python --no-deps dist/*.whl
          release-smoke/bin/merriv --help
          release-smoke/bin/python -c "import importlib.util, merriv; assert importlib.util.find_spec('m2' + 'riv') is None"
          legacy_command="m2""riv"
          test ! -e "release-smoke/bin/${legacy_command}"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/merriv.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write SHA-256 checksums
        run: cd dist && sha256sum *.whl *.tar.gz *.spdx.json > SHA256SUMS
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merriv-distributions-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download release bundle as inert data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merriv-distributions-${{ github.ref_name }}
          path: dist
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  pypi-state:
    needs: [build, attest]
    if: startsWith(github.ref, 'refs/tags/v') && vars.MERRIV_BRAND_CLEARED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      state: ${{ steps.pypi-state.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download attested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merriv-distributions-${{ github.ref_name }}
          path: dist
      - name: Isolate package files from checksums and SBOM
        run: |
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
      - name: Check whether this exact release is already on PyPI
        id: pypi-state
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          state="$(python tools/verify_pypi_release.py merriv "${version}" publish-dist)"
          echo "state=${state}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: [build, attest, pypi-state]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      vars.MERRIV_BRAND_CLEARED == 'true' &&
      needs.pypi-state.outputs.state == 'absent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/merriv
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download attested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merriv-distributions-${{ github.ref_name }}
          path: dist
      - name: Isolate package files from checksums and SBOM
        run: |
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist

  pypi-confirm:
    needs: [build, attest, pypi-state, publish]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      vars.MERRIV_BRAND_CLEARED == 'true' &&
      needs.build.result == 'success' && needs.attest.result == 'success' &&
      needs.pypi-state.result == 'success' &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' &&
        needs.pypi-state.outputs.state == 'matching'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download attested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merriv-distributions-${{ github.ref_name }}
          path: dist
      - name: Isolate package files from checksums and SBOM
        run: |
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
      - name: Verify PyPI contains this exact build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/verify_pypi_release.py merriv "${version}" publish-dist \
            --require-existing --attempts 10 --retry-delay 3

  github-release:
    needs: [build, attest, pypi-confirm]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' && needs.attest.result == 'success' &&
      needs.pypi-confirm.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the published release bundle as inert data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merriv-distributions-${{ github.ref_name }}
          path: dist
      - name: Create or finalize the permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          release_flags=(--verify-tag --title "Merriv ${RELEASE_TAG}" --generate-notes)
          prerelease=false
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc|\.dev)[0-9]+$ ]]; then
            release_flags+=(--prerelease)
            prerelease=true
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "Merriv ${RELEASE_TAG}" --prerelease="${prerelease}"
          else
            gh release create "${RELEASE_TAG}" dist/* "${release_flags[@]}"
          fi
