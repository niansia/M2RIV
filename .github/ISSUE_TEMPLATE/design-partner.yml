name: Design partner interest
description: Propose a real model-release workflow for a bounded collaboration
title: "[Design partner]: "
labels: ["design-partner"]
body:
  - type: dropdown
    id: workflow
    attributes:
      label: Release workflow
      options: [LLM inference, CV or edge, Compiler or runtime, Other deployment artifact]
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Model build change and current release decision
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence that can be shared safely
      description: Public/synthetic artifact options, runtime access, and constraints.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: A successful 30-day pilot would prove
    validations:
      required: true
