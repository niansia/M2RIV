[package]
name = "mcr-reference-rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Independent Rust producer/verifier for the MCR v1 conformance profile"
publish = false

[dependencies]
anyhow = "1.0"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
